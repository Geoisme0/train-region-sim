<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Tycoon</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      padding: 15px; 
      margin: 0;
      background-color: #111111;
      color: #f0f0f0;
      box-sizing: border-box;
    }

    /* Lock header width and center */
    header {
      text-align: center;
      margin: 0 auto 15px auto;
      max-width: 1200px;
    }

    header h1 {
      font-size: 1.8rem;
      margin: 5px 0;
    }

    header h2 {
      font-size: 1.3rem;
      color: #4cd964;
      margin: 5px 0;
    }

    /* Mobile Navigation Tabs (Hidden on Desktop) */
    .mobile-tabs {
      display: flex;
      gap: 10px;
      max-width: 1200px;
      margin: 0 auto 15px auto;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      background: #222222;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #007aff;
      color: #fff;
      border-color: #007aff;
    }

    /* Layout Container */
    .game-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Base Column Styles */
    .left-panel, .right-panel {
      flex: 1 1 0;
      min-width: 0;
      background: #222222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      color: #f0f0f0;
      box-sizing: border-box;
    }

    .middle-panel {
      flex: 2 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      text-align: center;
      color: #f0f0f0;
      box-sizing: border-box;
    }

    /* Card & Interface Elements */
    .region, .upgrade-card, .graph-card { 
      border: 1px solid #333; 
      padding: 16px; 
      margin-bottom: 15px; 
      width: 100%;
      box-sizing: border-box;
      background: #1a1a1a;
      border-radius: 8px;
      color: #f0f0f0;
    }

    #regions-container {
      width: 100%;
    }

    .graph-card h4 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }

    /* Touch-friendly Inputs */
    input[type="range"] {
      width: 100%;
      height: 28px;
      margin: 10px 0;
    }

    button {
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #444;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
    }

    button:active {
      background: #3a3a3c;
    }

    canvas {
      background: #111111;
      border: 1px solid #333;
      border-radius: 6px;
      display: block;
      width: 100%;
      height: 120px;
      box-sizing: border-box;
    }

    .legend {
      font-size: 11px;
      margin-top: 10px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .legend-item { 
      display: flex; 
      align-items: center; 
      gap: 4px; 
    }

    .dot { 
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      display: inline-block; 
    }

    /* --- MOBILE BREAKPOINT (< 768px) --- */
    @media (max-width: 768px) {
      .game-container {
        flex-direction: column;
      }

      /* Tab Control Visibility */
      .left-panel, .middle-panel, .right-panel {
        display: none;
        width: 100%;
      }

      .panel-active {
        display: flex !important;
      }
    }

    /* --- DESKTOP BREAKPOINT (>= 769px) --- */
    @media (min-width: 769px) {
      .mobile-tabs {
        display: none;
      }

      .left-panel, .middle-panel, .right-panel {
        display: flex !important;
      }

      .left-panel, .right-panel {
        display: block !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Train Region Sim</h1>
    <h2>Money: £<span id="player-money">1000</span></h2>
  </header>

  <!-- Mobile View Switcher -->
  <div class="mobile-tabs">
    <button class="tab-btn" onclick="switchTab('upgrades')">Upgrades</button>
    <button class="tab-btn active" onclick="switchTab('routes')">Routes</button>
    <button class="tab-btn" onclick="switchTab('analytics')">Analytics</button>
  </div>

  <div class="game-container">
    
    <!-- LEFT COLUMN: Train Upgrades -->
    <div class="left-panel" id="panel-upgrades">
      <h2 style="margin-top:0;">Upgrades</h2>
      <div id="upgrades-container">
        <p>Upgrade your trains to increase capacity, speed, and efficiency. Each upgrade boosts revenue.</p>
        <p>Current Upgrade Level: <span id="train-level">1</span></p>
        <p>Unlock regions to access new routes.</p>
      </div>
    </div>

    <!-- MIDDLE COLUMN: Regions & Trains -->
    <div class="middle-panel panel-active" id="panel-routes">
      <h2 style="margin-top:0;">Active Routes</h2>
      <div id="regions-container"></div>
    </div>

    <!-- RIGHT COLUMN: Graphs & Analytics -->
    <div class="right-panel" id="panel-analytics">
      <h2 style="margin-top:0;">Analytics</h2>
      <div id="graphs-container"></div>
    </div>

  </div>

  <!-- External JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
